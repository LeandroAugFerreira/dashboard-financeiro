name: Integridade e cálculos
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs
      - name: Reproduzir dados sintéticos sem alterar originais
        run: python3 scripts/verify_generator.py
